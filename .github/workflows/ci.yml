name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify Node.js version
        run: node --version && npm --version

      - name: Install root deps
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install server deps
        working-directory: server
        run: npm cache clean --force && npm install --legacy-peer-deps --verbose || (echo "Install failed, showing error details:" && npm list && exit 1)

      - name: Check server npm issues
        if: failure()
        working-directory: server
        run: |
          echo "=== npm cache ===" && npm cache verify
          echo "=== package.json ===" && cat package.json
          echo "=== package-lock.json (first 50 lines) ===" && head -50 package-lock.json

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit
